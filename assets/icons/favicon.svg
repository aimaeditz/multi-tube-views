<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="mtv-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Shield -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#mtv-grad)" />
  <rect x="32" y="32" width="448" height="448" rx="112" fill="none" stroke="#334155" stroke-width="8" />
  
  <!-- Screen/Player Geometry -->
  <rect x="96" y="112" width="320" height="200" rx="32" fill="#090d16" stroke="#475569" stroke-width="6" />
  
  <!-- Modern Geometric Play Symbol -->
  <path d="M 230 170 L 310 212 L 230 254 Z" fill="url(#accent-grad)" />
  
  <!-- MTV Lettermark -->
  <text x="256" y="390" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="900" fill="#f8fafc" letter-spacing="6" text-anchor="middle">MTV</text>
  
  <!-- Subtle Multi-indicator Dots -->
  <circle cx="160" cy="425" r="5" fill="#3b82f6" />
  <circle cx="256" cy="425" r="5" fill="#60a5fa" />
  <circle cx="352" cy="425" r="5" fill="#3b82f6" />
</svg>
